[project]
name = "comicbookguy"
version = "1.0.0"
description = "A helper tool to organise and monitor comic book directories"
authors = [
    {name = "Tom Freeman", email = "tomrfreeman3@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "numpy (>=2.5.2,<3.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "comicbox (>=4.8.7,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[project.scripts]
elibrarian = "comicbookguy.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
